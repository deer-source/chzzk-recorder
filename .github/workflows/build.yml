name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChzzkRecorder-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish as release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChzzkRecorder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChzzkRecorder.apk --title "최신 빌드" --notes "자동 빌드 ${{ github.sha }}"
